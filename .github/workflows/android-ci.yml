name: Android CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test, lint and assemble release
        run: ./gradlew --no-daemon test lintRelease assembleRelease

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cally-android-ci-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
            **/build/test-results/**
